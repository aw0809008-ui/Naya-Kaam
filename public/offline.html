<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline - Naya Kaam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7F8FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #E5E7EB;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #1E5AA8;
      border-radius: 16px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(30, 90, 168, 0.25);
    }
    .logo svg {
      width: 32px;
      height: 32px;
      fill: white;
    }
    h1 {
      color: #1A1A1A;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      color: #6B7280;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #1E5AA8;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #154277;
    }
    .note {
      margin-top: 24px;
      padding: 14px;
      background: #F3F4F6;
      border-radius: 12px;
      font-size: 13px;
      color: #4B5563;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
    </div>
    <h1>You're Currently Offline</h1>
    <p>Naya Kaam requires a network connection for live bookings. Cached worker details and previous records remain saved locally.</p>
    <a href="/" class="btn" onclick="location.reload(); return false;">Retry Connection</a>
    <div class="note">
      🛠️ <strong>Tip:</strong> You can install Naya Kaam as an app on your home screen for quick access anytime!
    </div>
  </div>
</body>
</html>
